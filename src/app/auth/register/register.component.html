<div class="auth-container">
  <h2>Créer un compte</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="reg-email">Email</label>
      <input id="reg-email"
             type="email"
             formControlName="email"
             autocomplete="email"
             [class.is-invalid]="
               email?.invalid && email?.touched
             ">
      <div *ngIf="email?.invalid && email?.touched"
           class="error-message">
        <span *ngIf="email?.errors?.['required']">
          L'email est obligatoire.
        </span>
        <span *ngIf="email?.errors?.['email']">
          Format d'email invalide.
        </span>
        <span *ngIf="email?.errors?.['emailExists']">
          Un compte avec cet email existe déjà.
        </span>
      </div>
    </div>

    <div class="form-group">
      <label for="reg-password">Mot de passe</label>
      <input id="reg-password"
             type="password"
             formControlName="password"
             autocomplete="new-password"
             [class.is-invalid]="
               password?.invalid && password?.touched
             ">
      <div *ngIf="password?.invalid && password?.touched"
           class="error-message">
        <span *ngIf="password?.errors?.['required']">
          Le mot de passe est obligatoire.
        </span>
        <span *ngIf="password?.errors?.['minlength']">
          8 caractères minimum.
        </span>
      </div>
    </div>

    <div class="form-group">
      <label for="confirm-password">
        Confirmer le mot de passe
      </label>
      <input id="confirm-password"
             type="password"
             formControlName="confirmPassword"
             autocomplete="new-password"
             [class.is-invalid]="
               registerForm.errors?.['passwordMismatch']
               && confirmPassword?.touched
             ">
      <!-- L'erreur passwordMismatch est lue sur registerForm.errors, pas sur confirmPassword.errors -->
      <!-- POURQUOI: le validateur croisé est posé au niveau du FormGroup -->
      <div *ngIf="
             registerForm.errors?.['passwordMismatch']
             && confirmPassword?.touched"
           class="error-message">
        Les mots de passe ne correspondent pas.
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <button type="submit"
            [disabled]="registerForm.invalid || isLoading">
      {{ isLoading ? 'Inscription...' : 'S\'inscrire' }}
    </button>

  </form>

  <p>Déjà un compte ?
    <a routerLink="/login">Se connecter</a>
  </p>
</div>
