<!-- login.component.html -->
<div class="login-container">
  <h1>Connexion</h1>

  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <div class="form-group">
      <label for="email">Adresse email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="votre@email.com"
        autocomplete="email"
      />
      <div class="error-messages" *ngIf="isEmailInvalid()">
        <span *ngIf="loginForm.get('email')?.hasError('required')">
          L'adresse email est obligatoire.
        </span>
        <span *ngIf="loginForm.get('email')?.hasError('email')">
          Veuillez saisir une adresse email valide.
        </span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      <div class="error-messages" *ngIf="isPasswordInvalid()">
        <span>Le mot de passe est obligatoire.</span>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid"
    >
      Se connecter
    </button>
  </form>

  <p>
    Pas encore de compte ?
    <a routerLink="/register">Créer un compte</a>
  </p>
</div>
