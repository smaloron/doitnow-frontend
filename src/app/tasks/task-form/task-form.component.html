<div class="form-container">
  <h2>
    {{ isEditMode ? 'Modifier la tâche' : 'Nouvelle tâche' }}
  </h2>

  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">

    <!-- Titre -->
    <div class="form-group">
      <label for="title">Titre *</label>
      <input id="title"
             type="text"
             formControlName="title"
             [class.is-invalid]="
               title?.invalid && title?.touched
             ">
      <div *ngIf="title?.invalid && title?.touched"
           class="error-message">
        <span *ngIf="title?.errors?.['required']">
          Le titre est obligatoire.
        </span>
        <span *ngIf="title?.errors?.['minlength']">
          3 caractères minimum.
        </span>
        <span *ngIf="title?.errors?.['maxlength']">
          100 caractères maximum.
        </span>
      </div>
      <!-- Affiche l'erreur de validation renvoyée par le backend pour ce champ -->
      <div *ngIf="apiErrors['title']"
           class="error-message api-error">
        {{ apiErrors['title'] }}
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description"
                formControlName="description"
                rows="3"
                maxlength="500">
      </textarea>
    </div>

    <!-- Priorité -->
    <div class="form-group">
      <label for="priority">Priorité</label>
      <select id="priority" formControlName="priority">
        <option *ngFor="let p of priorities" [value]="p">
          {{ p }}
        </option>
      </select>
    </div>

    <!-- Tags — FormArray dynamique -->
    <div class="form-group">
      <label>Tags</label>
      <div formArrayName="tags">
        <div *ngFor="let tag of tags.controls; let i = index"
             class="tag-row">
          <input [formControlName]="i"
                 type="text"
                 placeholder="Nom du tag">
          <button type="button" (click)="removeTag(i)">
            Supprimer
          </button>
        </div>
      </div>
      <button type="button"
              class="btn-secondary"
              (click)="addTag()">
        Ajouter un tag
      </button>
    </div>

    <!-- Date d'échéance -->
    <div class="form-group">
      <label for="dueDate">Date d'échéance</label>
      <input id="dueDate"
             type="date"
             formControlName="dueDate"
             [class.is-invalid]="
               dueDate?.invalid && dueDate?.touched
             ">
      <div *ngIf="dueDate?.errors?.['pastDate']
                  && dueDate?.touched"
           class="error-message">
        La date doit être aujourd'hui ou dans le futur.
      </div>
      <div *ngIf="apiErrors['dueDate']"
           class="error-message api-error">
        {{ apiErrors['dueDate'] }}
      </div>
    </div>

    <div class="form-actions">
      <button type="button"
              class="btn-secondary"
              routerLink="/tasks">
        Annuler
      </button>
      <button type="submit"
              [disabled]="taskForm.invalid || isLoading">
        {{ isLoading
           ? 'Enregistrement...'
           : (isEditMode ? 'Mettre à jour' : 'Créer') }}
      </button>
    </div>

  </form>
</div>
