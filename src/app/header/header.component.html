<!-- header.component.html -->
<header class="header">
  <div class="header-content">
    <a routerLink="/tasks" class="header__logo">DoItNow</a>
    <nav class="header__nav">
      <a
        routerLink="/tasks"
        routerLinkActive="active"
        class="header__link"
      >Mes tâches</a>
      <a
        routerLink="/stats"
        routerLinkActive="active"
        class="header__link"
      >Statistiques</a>
    </nav>
    <div class="header__actions">
      <a
        routerLink="/tasks/new"
        class="btn btn--primary"
      >Nouvelle tâche</a>
      <button
        type="button"
        class="btn btn--ghost"
        (click)="logout()"
      >Déconnexion</button>
    </div>
  </div>
</header>
